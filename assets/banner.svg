<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="40%" stop-color="#0c1427"/>
      <stop offset="80%" stop-color="#111836"/>
      <stop offset="100%" stop-color="#161233"/>
    </linearGradient>

    <!-- Animated Accent Line Gradient -->
    <linearGradient id="glowLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#34d399;#38bdf8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="1">
        <animate attributeName="stop-color" values="#818cf8;#34d399;#38bdf8;#818cf8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0">
        <animate attributeName="stop-color" values="#34d399;#38bdf8;#818cf8;#34d399" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="textShimmer" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#a5b4fc"/>
      <stop offset="75%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ffffff"/>
      <animate attributeName="x1" from="-100%" to="100%" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="100%" to="300%" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <radialGradient id="haloCyan" cx="85%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="haloViolet" cx="15%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.2; }
      50% { transform: scale(1.15); opacity: 0.35; }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    .orb-cyan { animation: pulseOrb 6s ease-in-out infinite; transform-origin: 85% 25%; }
    .orb-violet { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 15% 75%; }
    .floating-card-1 { animation: floatSlow 5s ease-in-out infinite; }
    .floating-card-2 { animation: floatReverse 6s ease-in-out infinite; }
    .floating-card-3 { animation: floatSlow 7s ease-in-out infinite; }
    .grid-line { stroke: #334155; stroke-opacity: 0.18; stroke-width: 1; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Glowing Radial Orbs -->
  <rect width="1200" height="400" fill="url(#haloCyan)" class="orb-cyan"/>
  <rect width="1200" height="400" fill="url(#haloViolet)" class="orb-violet"/>

  <!-- Subtle Perspective Grid Lines -->
  <g>
    <line x1="0" y1="80" x2="1200" y2="80" class="grid-line"/>
    <line x1="0" y1="160" x2="1200" y2="160" class="grid-line"/>
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line"/>
    <line x1="0" y1="320" x2="1200" y2="320" class="grid-line"/>
    <line x1="150" y1="0" x2="150" y2="400" class="grid-line"/>
    <line x1="350" y1="0" x2="350" y2="400" class="grid-line"/>
    <line x1="600" y1="0" x2="600" y2="400" class="grid-line"/>
    <line x1="850" y1="0" x2="850" y2="400" class="grid-line"/>
    <line x1="1050" y1="0" x2="1050" y2="400" class="grid-line"/>
  </g>

  <!-- Architectural Cityline Silhouettes (Right Side) -->
  <g opacity="0.38" transform="translate(760, 110)">
    <!-- Tower 1 -->
    <rect x="0" y="70" width="60" height="190" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.3"/>
    <line x1="15" y1="85" x2="15" y2="240" stroke="#38bdf8" stroke-opacity="0.35" stroke-dasharray="2 6"/>
    <line x1="45" y1="85" x2="45" y2="240" stroke="#38bdf8" stroke-opacity="0.35" stroke-dasharray="2 6"/>

    <!-- Tower 2 (Main Skyscraper) -->
    <rect x="75" y="20" width="85" height="240" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.5"/>
    <polygon points="75,20 117.5,-15 160,20" fill="#1e1b4b" stroke="#818cf8" stroke-opacity="0.6"/>
    <line x1="117.5" y1="-15" x2="117.5" y2="-35" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="117.5" cy="-36" r="3" fill="#34d399">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Windows Matrix -->
    <g fill="#38bdf8" opacity="0.45">
      <rect x="90" y="40" width="12" height="8" rx="1"/>
      <rect x="110" y="40" width="12" height="8" rx="1"/>
      <rect x="130" y="40" width="12" height="8" rx="1"/>
      <rect x="90" y="60" width="12" height="8" rx="1"/>
      <rect x="110" y="60" width="12" height="8" rx="1" fill="#34d399"/>
      <rect x="130" y="60" width="12" height="8" rx="1"/>
      <rect x="90" y="80" width="12" height="8" rx="1"/>
      <rect x="110" y="80" width="12" height="8" rx="1"/>
      <rect x="130" y="80" width="12" height="8" rx="1" fill="#f472b6"/>
      <rect x="90" y="100" width="12" height="8" rx="1"/>
      <rect x="110" y="100" width="12" height="8" rx="1"/>
      <rect x="130" y="100" width="12" height="8" rx="1"/>
    </g>

    <!-- Tower 3 -->
    <rect x="175" y="55" width="70" height="205" fill="#1e293b" stroke="#34d399" stroke-opacity="0.3"/>
    <line x1="195" y1="70" x2="195" y2="240" stroke="#34d399" stroke-opacity="0.35" stroke-dasharray="2 6"/>
    <line x1="225" y1="70" x2="225" y2="240" stroke="#34d399" stroke-opacity="0.35" stroke-dasharray="2 6"/>

    <!-- Tower 4 (Compact) -->
    <rect x="260" y="95" width="65" height="165" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.3"/>
    <line x1="280" y1="110" x2="280" y2="240" stroke="#818cf8" stroke-opacity="0.35" stroke-dasharray="2 6"/>
  </g>

  <!-- Floating Feature Stat Cards (Right/Center Decorative) -->
  <g class="floating-card-1" transform="translate(860, 60)" filter="url(#softShadow)">
    <rect width="180" height="60" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.2"/>
    <circle cx="28" cy="30" r="14" fill="#0284c7" fill-opacity="0.3"/>
    <text x="28" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle" fill="#38bdf8">🏢</text>
    <text x="52" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">100k+ Units</text>
    <text x="52" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Active Portfolios</text>
  </g>

  <g class="floating-card-2" transform="translate(940, 160)" filter="url(#softShadow)">
    <rect width="190" height="60" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-opacity="0.5" stroke-width="1.2"/>
    <circle cx="28" cy="30" r="14" fill="#059669" fill-opacity="0.3"/>
    <text x="28" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle" fill="#34d399">⚡</text>
    <text x="52" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">Auto Rent Flow</text>
    <text x="52" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">ACH &amp; Cards Enabled</text>
  </g>

  <g class="floating-card-3" transform="translate(880, 260)" filter="url(#softShadow)">
    <rect width="180" height="60" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.2"/>
    <circle cx="28" cy="30" r="14" fill="#4f46e5" fill-opacity="0.3"/>
    <text x="28" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle" fill="#818cf8">🛠️</text>
    <text x="52" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">Work Orders</text>
    <text x="52" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Tenant Portals</text>
  </g>

  <!-- Main Left Content -->
  <g transform="translate(70, 70)">
    <!-- Pill Badge -->
    <g>
      <rect width="360" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.6" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4" fill="#34d399">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" letter-spacing="0.8">CURATED REAL ESTATE TECH ECOSYSTEM</text>
    </g>

    <!-- Main Title with Dynamic Shimmer Gradient -->
    <text x="0" y="82" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="url(#textShimmer)" letter-spacing="-0.8">
      Awesome Rental Property Management
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="122" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#cbd5e1" letter-spacing="0.1">
      The definitive index of leading <tspan font-weight="700" fill="#38bdf8">Commercial SaaS Platforms</tspan> and <tspan font-weight="700" fill="#34d399">Open-Source PMS Systems</tspan>
    </text>
    <text x="0" y="148" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      Covering Tenant Portals • Automated Rent • Legal Leases • Maintenance Dispatch • Trust Accounting
    </text>

    <!-- Interactive Badges Bar -->
    <g transform="translate(0, 185)">
      <!-- Badge 1 -->
      <g>
        <rect width="130" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.2"/>
        <text x="65" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">🏢 SaaS Leaders</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(142, 0)">
        <rect width="140" height="34" rx="17" fill="#0f172a" stroke="#34d399" stroke-opacity="0.5" stroke-width="1.2"/>
        <text x="70" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">🔓 Open-Source</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(294, 0)">
        <rect width="140" height="34" rx="17" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.2"/>
        <text x="70" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">💰 Pricing &amp; Limits</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(446, 0)">
        <rect width="135" height="34" rx="17" fill="#0f172a" stroke="#f472b6" stroke-opacity="0.5" stroke-width="1.2"/>
        <text x="67.5" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">⭐ Star Rankings</text>
      </g>
    </g>
  </g>

  <!-- Bottom Animated Glowing Border -->
  <line x1="0" y1="398" x2="1200" y2="398" stroke="url(#glowLineGrad)" stroke-width="3" filter="url(#glow)"/>
</svg>